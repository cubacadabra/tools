name: Cross-repository compatibility runner

on:
  workflow_call:
    inputs:
      tools_repository:
        required: false
        type: string
        default: cubacadabra/tools
      tools_ref:
        required: false
        type: string
        default: main
      rust_ref:
        required: false
        type: string
        default: main
      web_ref:
        required: false
        type: string
        default: main
      examples_ref:
        required: false
        type: string
        default: main
      studio_ref:
        required: false
        type: string
        default: main
      desktop_ref:
        required: false
        type: string
        default: main
      ios_ref:
        required: false
        type: string
        default: main
      android_ref:
        required: false
        type: string
        default: main

jobs:
  game-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tools_repository }}
          ref: ${{ inputs.tools_ref }}
          path: tools
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/examples
          ref: ${{ inputs.examples_ref }}
          path: examples
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/rust
          ref: ${{ inputs.rust_ref }}
          path: rust
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/web
          ref: ${{ inputs.web_ref }}
          path: web
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/studio
          ref: ${{ inputs.studio_ref }}
          path: studio
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/desktop
          ref: ${{ inputs.desktop_ref }}
          path: desktop
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/ios
          ref: ${{ inputs.ios_ref }}
          path: ios
      - uses: actions/checkout@v4
        with:
          repository: cubacadabra/android
          ref: ${{ inputs.android_ref }}
          path: android
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/src/engine/renderer-startup.test.js web/scripts/prepare-deployment.test.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: sh rust/scripts/build_web_renderer.sh --debug
      - run: node web/scripts/check-app-contract.mjs
      - run: PYTHONPATH=tools/src python3 tools/scripts/check_workspace_compatibility.py
      - run: python3 tools/scripts/check_world_model_hosts.py
      - run: cargo test --manifest-path studio/Cargo.toml --no-default-features
      - run: cargo test --manifest-path desktop/Cargo.toml

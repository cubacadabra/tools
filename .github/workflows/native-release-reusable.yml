name: Native application release runner

on:
  workflow_call:
    inputs:
      app_repository:
        required: true
        type: string
      app_ref:
        required: true
        type: string
      app_directory:
        required: true
        type: string
      app_name:
        required: true
        type: string
      display_name:
        required: true
        type: string
      archive_prefix:
        required: true
        type: string
      cargo_manifest:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      bundle_builder:
        required: false
        type: boolean
        default: true
      rust_repository:
        required: false
        type: string
        default: cubacadabra/rust
      rust_ref:
        required: false
        type: string
        default: main
      tools_repository:
        required: false
        type: string
        default: cubacadabra/tools
      tools_ref:
        required: false
        type: string
        default: main
      game_repository:
        required: false
        type: string
        default: ""
      game_ref:
        required: false
        type: string
        default: main
    secrets:
      MACOS_DEVELOPER_ID_P12:
        description: Base64-encoded Developer ID Application certificate and private key
        required: true
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        description: Password used when exporting the Developer ID Application certificate
        required: true
      APPLE_NOTARY_KEY_P8:
        description: App Store Connect team API private key contents
        required: true
      APPLE_NOTARY_KEY_ID:
        description: App Store Connect team API key ID
        required: true
      APPLE_NOTARY_ISSUER_ID:
        description: App Store Connect team API issuer ID
        required: true

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_ref }}
          path: ${{ inputs.app_directory }}

      - name: Check out shared Rust engine
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rust_repository }}
          ref: ${{ inputs.rust_ref }}
          path: rust

      - name: Check out shared tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tools_repository }}
          ref: ${{ inputs.tools_ref }}
          path: tools

      - name: Check out bundled game
        if: inputs.game_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.game_repository }}
          ref: ${{ inputs.game_ref }}
          path: first-game

      - name: Validate release tag
        shell: bash
        env:
          APP_DIRECTORY: ${{ inputs.app_directory }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(awk -F'"' '/^version = / { print $2; exit }' "${APP_DIRECTORY}/Cargo.toml")"
          [[ -n "${manifest_version}" ]]
          if [[ "${tag_version}" != "${manifest_version}" && "${tag_version}" != "${manifest_version}"-* ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match ${APP_DIRECTORY} Cargo version ${manifest_version} or add a -suffix." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native application
        env:
          CUBACADABRA_BACKEND_URL: https://api.cubacadabra.com/
        run: cargo build --release --manifest-path "${{ inputs.cargo_manifest }}" --bin "${{ inputs.binary_name }}" --target "${{ matrix.target }}"

      - name: Build bundled native game builder
        if: inputs.bundle_builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cargo build --release \
            --manifest-path tools/Cargo.toml \
            --bin cubacadabra \
            --target "${{ matrix.target }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp "tools/target/${{ matrix.target }}/release/cubacadabra.exe" staging/cubacadabra.exe
          else
            cp "tools/target/${{ matrix.target }}/release/cubacadabra" staging/cubacadabra
          fi

      - name: Install macOS signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          trap 'rm -f "${certificate_path}"' EXIT

          printf '%s' "${MACOS_DEVELOPER_ID_P12}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          signing_identity="$(
            security find-identity -v -p codesigning "${keychain_path}" |
              awk -F'"' '/Developer ID Application:/ { print $2; exit }'
          )"
          if [[ -z "${signing_identity}" ]]; then
            echo "The signing archive does not contain a valid Developer ID Application identity." >&2
            exit 1
          fi

          echo "MACOS_SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"

      - name: Package macOS application
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          APP_DIRECTORY: ${{ inputs.app_directory }}
          APP_NAME: ${{ inputs.app_name }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          ARCHIVE_PREFIX: ${{ inputs.archive_prefix }}
          BINARY_NAME: ${{ inputs.binary_name }}
          BUNDLE_BUILDER: ${{ inputs.bundle_builder }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app_bundle="${DISPLAY_NAME}.app"
          app_root="staging/${app_bundle}"
          archive="${ARCHIVE_PREFIX}-${GITHUB_REF_NAME}-macos-${ARCH}.dmg"
          app_notarization_archive="${RUNNER_TEMP}/${ARCHIVE_PREFIX}-app-notarization.zip"
          notary_key="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          dmg_root="staging/${ARCHIVE_PREFIX}-${GITHUB_REF_NAME}-macos-${ARCH}"
          trap 'rm -f "${notary_key}" "${app_notarization_archive}"' EXIT
          printf '%s' "${APPLE_NOTARY_KEY_P8}" > "${notary_key}"
          chmod 600 "${notary_key}"

          rm -rf "${app_root}" "${dmg_root}"
          mkdir -p "${app_root}/Contents/MacOS" "${app_root}/Contents/Resources" dist
          cp "${APP_DIRECTORY}/target/${TARGET}/release/${BINARY_NAME}" "${app_root}/Contents/MacOS/${BINARY_NAME}"
          cp rust/assets/images/logo.png "${app_root}/Contents/Resources/logo.png"
          if [[ "${BUNDLE_BUILDER}" == "true" ]]; then
            cp staging/cubacadabra "${app_root}/Contents/Resources/cubacadabra"
          fi
          iconset="staging/logo.iconset"
          mkdir -p "${iconset}"
          for size in 16 32 128 256 512; do
            sips -z "${size}" "${size}" rust/assets/images/logo.png --out "${iconset}/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "${doubled}" "${doubled}" rust/assets/images/logo.png --out "${iconset}/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "${iconset}" -o "${app_root}/Contents/Resources/logo.icns"
          sed "s/__VERSION__/${version}/g; s/Cubacadabra Desktop/${DISPLAY_NAME}/g; s/<string>desktop<\/string>/<string>${BINARY_NAME}<\/string>/g; s/com.cubacadabra.desktop/com.cubacadabra.${APP_NAME}/g" \
            "${APP_DIRECTORY}/packaging/macos/Info.plist" > "${app_root}/Contents/Info.plist"
          chmod +x "${app_root}/Contents/MacOS/${BINARY_NAME}"

          if [[ "${BUNDLE_BUILDER}" == "true" ]]; then
            codesign --force --options runtime --timestamp \
              --sign "${MACOS_SIGNING_IDENTITY}" \
              "${app_root}/Contents/Resources/cubacadabra"
          fi
          codesign --force --options runtime --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${app_root}/Contents/MacOS/${BINARY_NAME}"
          codesign --force --options runtime --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${app_root}"
          codesign --verify --deep --strict --verbose=2 "${app_root}"

          ditto -c -k --sequesterRsrc --keepParent "${app_root}" "${app_notarization_archive}"
          xcrun notarytool submit "${app_notarization_archive}" \
            --key "${notary_key}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait \
            --timeout 30m
          xcrun stapler staple "${app_root}"
          xcrun stapler validate "${app_root}"
          spctl --assess --type execute --verbose=2 "${app_root}"

          # A DMG with an Applications shortcut gives users the expected
          # drag-to-install flow. The app and the disk image are both signed;
          # the image is notarized as the artifact that gets distributed.
          mkdir -p "${dmg_root}"
          ditto "${app_root}" "${dmg_root}/${app_bundle}"
          ln -s /Applications "${dmg_root}/Applications"
          if command -v SetFile >/dev/null 2>&1; then
            cp "${app_root}/Contents/Resources/logo.icns" "${dmg_root}/.VolumeIcon.icns"
            SetFile -a C "${dmg_root}"
          fi

          hdiutil create \
            -volname "${DISPLAY_NAME}" \
            -srcfolder "${dmg_root}" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/${archive}"
          codesign --force --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "dist/${archive}"
          codesign --verify --verbose=2 "dist/${archive}"
          xcrun notarytool submit "dist/${archive}" \
            --key "${notary_key}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait \
            --timeout 30m
          xcrun stapler staple "dist/${archive}"
          xcrun stapler validate "dist/${archive}"
          spctl --assess --type open --verbose=2 "dist/${archive}"

      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          APP_DIRECTORY: ${{ inputs.app_directory }}
          ARCHIVE_PREFIX: ${{ inputs.archive_prefix }}
          BINARY_NAME: ${{ inputs.binary_name }}
          BUNDLE_BUILDER: ${{ inputs.bundle_builder }}
        run: |
          set -euo pipefail
          archive="${ARCHIVE_PREFIX}-${GITHUB_REF_NAME}-windows-${ARCH}.zip"
          staging="staging/${ARCHIVE_PREFIX}-${GITHUB_REF_NAME}-windows-${ARCH}"
          mkdir -p "${staging}" dist
          cp "${APP_DIRECTORY}/target/${TARGET}/release/${BINARY_NAME}.exe" "${staging}/${BINARY_NAME}.exe"
          if [[ "${BUNDLE_BUILDER}" == "true" ]]; then
            cp staging/cubacadabra.exe "${staging}/cubacadabra.exe"
          fi
          cp "${APP_DIRECTORY}/LICENSE" "${APP_DIRECTORY}/COPYRIGHT" "${staging}/"
          (cd staging && 7z a -tzip "../dist/${archive}" "$(basename "${staging}")")

      - name: Package Linux application
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          APP_DIRECTORY: ${{ inputs.app_directory }}
          ARCHIVE_PREFIX: ${{ inputs.archive_prefix }}
          BINARY_NAME: ${{ inputs.binary_name }}
          BUNDLE_BUILDER: ${{ inputs.bundle_builder }}
        run: |
          set -euo pipefail
          archive="${ARCHIVE_PREFIX}-${GITHUB_REF_NAME}-linux-${ARCH}.tar.gz"
          staging="staging/${ARCHIVE_PREFIX}-${GITHUB_REF_NAME}-linux-${ARCH}"
          mkdir -p "${staging}" dist
          cp "${APP_DIRECTORY}/target/${TARGET}/release/${BINARY_NAME}" "${staging}/${BINARY_NAME}"
          if [[ "${BUNDLE_BUILDER}" == "true" ]]; then
            cp staging/cubacadabra "${staging}/cubacadabra"
          fi
          cp "${APP_DIRECTORY}/LICENSE" "${APP_DIRECTORY}/COPYRIGHT" "${staging}/"
          tar -C staging -czf "dist/${archive}" "$(basename "${staging}")"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "${DISPLAY_NAME} ${GITHUB_REF_NAME}" --generate-notes
          fi

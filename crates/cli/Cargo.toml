[package]
name = "cubacadabra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cubacadabra"
path = "src/main.rs"

[dependencies]
cubacadabra-builder = { path = "../builder" }
cubacadabra-project = { path = "../project" }
cubacadabra-reference-import = { path = "../reference-import" }
cubacadabra-scene = { path = "../scene" }
glam = "0.30"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
